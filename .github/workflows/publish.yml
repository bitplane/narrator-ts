name: Publish

on:
  push:
    tags: ['v*']
  # Run the whole thing by hand, stopping short of the registry. A tag-driven
  # publish cannot be rehearsed and cannot be taken back, so this exists to
  # find the broken secret or the failing test on a run that does not count.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to check against package.json, e.g. 0.1.0'
        required: true
      publish:
        description: 'Actually publish? Leave false to dry run.'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance: the job signs an attestation tying the
      # published tarball to this repository, commit and workflow.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Publishing v0.1.1 from a tree that says 0.1.0 is the mistake this
      # catches, and it is unrecoverable afterwards: a version number cannot
      # be reused once it has been on the registry.
      - name: Version must match package.json
        run: |
          want="${{ inputs.version || github.ref_name }}"
          want="${want#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$want" != "$pkg" ]; then
            echo "asked for v$want, package.json says $pkg" >&2
            exit 1
          fi
          echo "publishing $pkg"

      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test

      # prepublishOnly builds and tests again; that is deliberate. The steps
      # above are there so a failure says which one, rather than dying inside
      # a publish.
      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        run: npm publish --provenance --access public --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
