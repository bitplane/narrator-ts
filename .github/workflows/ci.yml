name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      # The Amiga binaries are gitignored, so everything that diffs against
      # them skips here. What is left is the free tables and the parts that
      # need no reference: enough to catch a build break, not enough to prove
      # fidelity. That still takes a local run with the binaries present.
      - run: npm test
